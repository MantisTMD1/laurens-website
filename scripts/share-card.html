<!doctype html>
<!-- Source for share.jpg (the link preview image). Rebuild with: npm run share -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..600&family=Figtree:wght@400..600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Figtree, system-ui, sans-serif; color: #f6f2ee; background: #2a2229; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 12%; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(42,34,41,.92) 0%, rgba(42,34,41,.72) 42%, rgba(42,34,41,0) 70%); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 96px; height: 96px; border-radius: 50%; background: #f6f2ee; padding: 6px; box-sizing: border-box; }
  h1 { font-family: "Bricolage Grotesque", Figtree, sans-serif; font-weight: 600; font-size: 62px; line-height: 1.04; letter-spacing: 0; margin: 36px 0 20px; }
  p { font-size: 26px; line-height: 1.35; margin: 0; color: #e7dfe6; }
  .tag { margin-top: 32px; display: inline-flex; align-self: flex-start; padding: 12px 22px; border-radius: 10px; background: #73458a; font-size: 22px; font-weight: 500; }
</style></head>
<body>
  <img class="bg" src="../assets/img/photos/lauren-gym-portrait.jpg" alt="">
  <div class="shade"></div>
  <div class="text">
    <img class="logo" src="../assets/img/photos/fit-lab-logo.png" alt="">
    <h1>Building strong minds and bodies.</h1>
    <p>Personal training with Lauren in Johnson Creek and Wales, Wisconsin.</p>
    <span class="tag">Trial sessions from $20</span>
  </div>
</body></html>
